<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Step inside, Roomful</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#c42d61">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/room.css">
  <script type="importmap">{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.0.0/dist/spark.module.js"
  } }</script>
  <script type="module" src="/walk.js"></script>
</head>
<body class="walk3d">
  <header class="w3-top">
    <a class="wordmark" href="/"><img src="/img/roomful-180.png" alt="" width="26" height="26"><span>Roomful</span></a>
    <p id="w3-name" class="w3-name"></p>
    <button id="w3-vr" class="w3-btn" type="button" hidden>Enter VR</button>
  </header>
  <div id="w3-load" class="w3-load">
    <p id="w3-status">Building your world</p>
    <div class="w3-bar"><i id="w3-progress"></i></div>
    <p class="w3-sub" id="w3-sub">World Labs is turning the painting into a space you can walk through. This takes about five minutes. This page opens it by itself when it is ready.</p>
    <button id="w3-retry" class="w3-retry" type="button" hidden>Try again</button>
  </div>
  <div class="w3-keys" aria-hidden="true">
    <div class="w3-row"><span data-k="w">W</span></div>
    <div class="w3-row"><span data-k="a">A</span><span data-k="s">S</span><span data-k="d">D</span></div>
    <p>Walk slowly with WASD. Drag or use the arrow keys to look.</p>
  </div>
  <div class="w3-pad" aria-label="Movement">
    <span></span><button type="button" data-move="f" aria-label="Forward">↑</button><span></span>
    <button type="button" data-turn="1" aria-label="Turn left">↺</button><button type="button" data-move="b" aria-label="Back">↓</button><button type="button" data-turn="-1" aria-label="Turn right">↻</button>
  </div>
  <p class="w3-note" id="w3-note">A world built from your room by World Labs Marble.</p>
</body>
</html>
